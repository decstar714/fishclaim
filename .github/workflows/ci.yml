# One workflow for both halves. That is the point of the monorepo: a change to
# the API and a change to its caller land in the same pull request and are
# checked in the same run.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "tests/ not present; skipping pytest."
          fi

      # Importing app.main builds Settings and calls create_all, so it needs a
      # database URL and a key that passes validation. SQLite keeps this free of
      # a service container -- the step only has to prove the app imports.
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-only-not-a-real-key-0123456789abcdef
        run: |
          python -m compileall app
          python - <<'PY'
          import importlib
          import sys

          try:
              importlib.import_module("app.main")
              print("app.main import successful")
          except Exception as exc:
              print(f"Import failed: {exc}", file=sys.stderr)
              raise
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Both halves agree on the API surface, or this fails. The drift this repo was
  # created to stop -- the UI calling routes the API does not serve -- is exactly
  # what this catches.
  contract:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Every route the UI calls must exist
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-only-not-a-real-key-0123456789abcdef
        run: python scripts/check_api_contract.py
