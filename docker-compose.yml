name: fishclaim

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishclaim_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://fishclaim:fishclaim@fishclaim-db:5432/fishclaim}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - fishclaim

  db:
    image: postgis/postgis:16-3.4
    container_name: fishclaim-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fishclaim}
      POSTGRES_USER: ${POSTGRES_USER:-fishclaim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fishclaim}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishclaim} -d ${POSTGRES_DB:-fishclaim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishclaim

networks:
  fishclaim:
    external: true
    name: fishclaim_default

volumes:
  db_data:
