server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app is client-routed, so any unknown path must return
    # index.html rather than a 404, or a refresh on a deep link breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API so the browser only ever talks to one origin. This is what
    # lets the frontend use a relative /api base and avoids CORS entirely in
    # the staging deployment.
    #
    # BACKEND_ORIGIN is substituted at container start by docker-entrypoint,
    # so the same image can point at a different backend without a rebuild.
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN}/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
